parameters:
    locale: "es"
    app.secret: "%env(resolve:APP_SECRET)%"
    sitemap_dir: "%kernel.project_dir%/public/sitemap"
    app.subscription.monthly_price: '9,99 € / mes'
    app.subscription.yearly_price: '59,99 € / año'
    app.mail.default_from: '%env(resolve:DEFAULT_FROM_EMAIL)%'
    app.mail.default_name: '%env(resolve:DEFAULT_FROM_EMAIL_NAME)%'
    app.stripe.monthly_price_id: "%env(resolve:STRIPE_MONTHLY_PRICE_ID)%"
    app.stripe.yearly_price_id: "%env(resolve:STRIPE_YEARLY_PRICE_ID)%"
    app.stripe.public_key: "%env(resolve:STRIPE_PUBLIC_KEY)%"
    app.stripe.secret_key: "%env(resolve:STRIPE_SECRET_KEY)%"
    app.stripe.webhook_secret: "%env(resolve:STRIPE_WEBHOOK_SECRET)%"
    app.product_download_presigned_ttl: "+10 minutes"
    app.api.gating_enabled: "%env(bool:APP_API_GATING_ENABLED)%"
    app.mobile.min_supported_version: "%env(resolve:MOBILE_MIN_SUPPORTED_VERSION)%"
    app.mobile.store_url: "%env(resolve:MOBILE_STORE_URL)%"
    app.legal.terms_url: "%env(resolve:LEGAL_TERMS_URL)%"
    app.legal.privacy_url: "%env(resolve:LEGAL_PRIVACY_URL)%"
    app.apple.bundle_id: "%env(resolve:APPLE_BUNDLE_ID)%"
    app.apple.environment: "%env(resolve:APPLE_ENVIRONMENT)%"
    app.apple.issuer_id: "%env(resolve:APPLE_ISSUER_ID)%"
    app.apple.key_id: "%env(resolve:APPLE_KEY_ID)%"
    app.apple.private_key_path: "%env(resolve:APPLE_PRIVATE_KEY_PATH)%"
    app.apple.root_certificate_path: "%kernel.project_dir%/config/apple/AppleRootCA-G3.cer"
    app.apple.legacy_access_cutoff: "%env(resolve:APPLE_LEGACY_ACCESS_CUTOFF)%"
    app.apple.monthly_product_id: "%env(resolve:APPLE_MONTHLY_PRODUCT_ID)%"
    app.apple.yearly_product_id: "%env(resolve:APPLE_YEARLY_PRODUCT_ID)%"

imports:
    - { resource: "services/admin.yaml" }

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
        bind:
            $projectDir: "%kernel.project_dir%"
            $sitemapDir: "%sitemap_dir%"
            $env: "%kernel.environment%"

    Symfony\Component\Config\Definition\Builder\ValidationBuilder:
        autowire: true

    App\:
        resource: "../src/*"
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'


    App\Service\Shop\SendBookCommand:
        arguments:
            $pool: "@sonata.media.pool"

    App\Controller\:
        resource: "../src/Controller"
        tags: ["controller.service_arguments"]

    Aws\S3\S3Client:
        arguments:
            - version: "latest"
              region: "%env(S3_BUCKET_REGION)%"
              credentials:
                  key: "%env(S3_ACCESS_KEY)%"
                  secret: "%env(S3_SECRET_KEY)%"
                  
    Sonata\MediaBundle\Generator\PathGenerator: ~
