# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    http_method_override: false
    handle_all_throwables: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_lifetime: 172800
        cookie_secure: auto
        cookie_samesite: lax

    esi: true
    #fragments: true
    php_errors:
        log: true

    rate_limiter:
        api_login:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
        api_register:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        api_password_reset:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # Each question costs Gemini tokens, so one account gets a daily budget of
        # questions and one IP address cannot burst through many accounts.
        file_ai_chat_user:
            policy: 'sliding_window'
            limit: 40
            interval: '1 day'
        file_ai_chat_ip:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'
        api_apple_transaction:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'

    serializer:
        enabled: true
        mapping:
            paths: ['%kernel.project_dir%/config/serializer/'] 

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
