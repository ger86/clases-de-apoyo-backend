<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<style>
  @page {
    size: A4;
    margin: 19mm 16mm 16mm 16mm;
    @top-center {
      content: "www.clasesdeapoyo.com";
      font-family: "Varela Round", "Arial Rounded MT Bold", sans-serif;
      font-size: 17pt;
      font-weight: bold;
      color: #107896;
      vertical-align: bottom;
      padding-bottom: 3mm;
    }
    @bottom-center {
      content: counter(page);
      font-family: "Times New Roman", Times, serif;
      font-size: 10.5pt;
    }
  }
  html, body { margin: 0; padding: 0; background: #fff; }
  body {
    font-family: "Times New Roman", Times, serif;
    font-size: 10.5pt;
    line-height: 1.32;
    color: #000;
    text-align: justify;
    hyphens: auto;
  }
  .katex { font-size: 1.05em; }
  .watermark {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-58deg);
    font-family: "Varela Round", Arial, sans-serif;
    font-size: 58pt;
    font-weight: bold;
    color: rgba(0, 0, 0, 0.045);
    white-space: nowrap;
    z-index: 1000;
    pointer-events: none;
  }
  .titulo { text-align: center; font-weight: bold; margin: 4mm 0 5mm; }
  .titulo .uni { font-size: 14pt; line-height: 1.15; }
  .titulo .curso { font-size: 11.5pt; margin-top: 1mm; }
  .titulo .materia { font-size: 12pt; }
  .instr-tit { text-align: center; font-weight: bold; margin: 4mm 0 3mm; }
  p { margin: 0 0 1.6mm; }
  .bloque { font-weight: bold; margin: 4mm 0 3mm; }
  .enunciado { margin-top: 4mm; }
  .enunciado .preg { font-weight: bold; font-size: 11.5pt; }
  .enunciado ol { list-style: none; margin: 1mm 0 1mm 7mm; padding: 0; }
  .enunciado ol li { margin: 0 0 1mm; padding-left: 7mm; text-indent: -7mm; }
  .enunciado ol li b.l { display: inline-block; width: 7mm; text-indent: 0; }
  .enunciado .sub { margin: 1.5mm 0 1.5mm 7mm; }
  .enunciado .sub p { margin: 0 0 1.5mm; }
  .sol { font-weight: bold; margin: 2mm 0 1mm; }
  .ap { display: flex; gap: 0; margin: 2.5mm 0 1mm; }
  .ap > .lab { flex: 0 0 11mm; font-weight: bold; }
  .ap > .txt { flex: 1; }
  .ind { padding-left: 11mm; }
  .eq { text-align: center; margin: 1.5mm 0; break-inside: avoid; }
  .eq .katex-display { margin: 0.6mm 0; }
  .fig-r { float: right; margin: 0 0 2mm 4mm; text-align: center; break-inside: avoid; }
  .fig-r img { display: block; }
  .nota { margin: 1.5mm 0 1mm 11mm; }
  .res { margin: 1.5mm 0; }
  .clear { clear: both; }
  .avoid { break-inside: avoid; }
  .new-page { break-before: page; }
  .two { margin: 1mm 0 0 11mm; }
  .two b { font-weight: bold; }
  ul.casos { margin: 1mm 0 1mm 11mm; padding-left: 5mm; }
  ul.casos li { margin-bottom: 1mm; }
</style>
</head>
<body>
<div class="watermark">www.clasesdeapoyo.com</div>

<div class="titulo">
  <div class="uni">UNIVERSIDADES PÚBLICAS DE LA COMUNIDAD DE MADRID<br>{{PRUEBA, copied from the exam}}</div>
  <div class="curso">{{SESSION}} Curso {{YYYY/YYYY}}</div>
  <div class="materia">MATERIA: {{MATERIA}}</div>
</div>

<div class="instr-tit">{{INSTRUCCIONES title, copied from the exam}}</div>
<p>{{Instructions, CALIFICACIÓN and TIEMPO, copied from the exam}}</p>

<!-- {{CONTENT: blocks, statements and solutions. See example-2027-modelo-matematicas-ii/solucion.html}} -->

<script>
document.addEventListener("DOMContentLoaded", function () {
  renderMathInElement(document.body, {
    delimiters: [
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    throwOnError: false
  });
});
</script>
</body>
</html>
